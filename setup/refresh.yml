name: Refresh postings

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17 (UTC)
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: refresh-postings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape employer job boards
        run: python scraper/scrape.py
      - name: Commit new data
        run: |
          git config user.name "portage-bot"
          git config user.email "portage-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Refresh postings"
          git push
