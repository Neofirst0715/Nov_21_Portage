name: Refresh postings

on:
  workflow_dispatch:        # manual only: press "Run workflow" when you want fresh postings
  # To refresh automatically as well, uncomment the next two lines (this example is every 6 hours):
  # schedule:
  #   - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-postings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape employer job boards
        run: python scraper/scrape.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          PORTAGE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Commit new data
        run: |
          git config user.name "portage-bot"
          git config user.email "portage-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Refresh postings"
          git push
